name: Actualizar datos CROWN

on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 min (GitHub puede atrasarlo unos minutos en horas de alta carga)
  workflow_dispatch: {}       # botón "Run workflow" para forzar una actualización (úsalo en la noche de la final)
  push:
    branches: [main]
    paths: ["scripts/**", "data/pageants.json", "data/contestants.json", ".github/workflows/update.yml"]

permissions:
  contents: write

concurrency:
  group: crown-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consultar fuentes
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}      # opcional: Graph API oficial de Instagram
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/update.py
      - name: Guardar cambios
        run: |
          git config user.name "crown-bot"
          git config user.email "crown-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "datos: actualización automática $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
