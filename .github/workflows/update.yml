name: Actualizar datos CROWN

# Robot "siempre encendido": cada ejecución dura ~5 h 40 min y actualiza cada ~8 min
# (en cada vuelta baja el código nuevo del repo). Al terminar se relanza sola.
# El cron queda como respaldo; la concurrencia evita que corran dos a la vez.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/workflows/update.yml"]

permissions:
  contents: write
  actions: write

concurrency:
  group: crown-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Robot en vivo (bucle)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          git config user.name "crown-bot"
          git config user.email "crown-bot@users.noreply.github.com"
          echo "IG_TOKEN configurado: $([ -n "$IG_TOKEN" ] && echo sí || echo no) · IG_USER_ID: $([ -n "$IG_USER_ID" ] && echo sí || echo no)"
          END=$((SECONDS + 340*60))
          while [ $SECONDS -lt $END ]; do
            START=$SECONDS
            git pull -q --rebase -X theirs origin main || git rebase --abort || true
            timeout 900 python scripts/update.py || echo "corrida con errores"
            git add data/
            if ! git diff --cached --quiet; then
              git commit -q -m "datos: actualización automática $(date -u +%Y-%m-%dT%H:%MZ)"
              for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q && break; sleep 5; done
            fi
            ELAPSED=$((SECONDS - START))
            if [ $ELAPSED -lt 480 ]; then sleep $((480 - ELAPSED)); else sleep 30; fi
          done
      - name: Relanzar el robot
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --ref main -R ${{ github.repository }} || true
